apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-app-config
  labels:
    app: yatri-app
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PORT: "8080"
  DEFAULT_CURRENCY: "INR"
  MAX_BOOKING_DAYS: "30"
---
apiVersion: v1
kind: Secret
metadata:
  name: yatri-db-secret
  labels:
    app: yatri-app
type: Opaque
data:
  POSTGRES_USER: eWF0cmlfYWRtaW4=
  POSTGRES_PASSWORD: c2VjcmV0cGFzc3dvcmQ=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-app
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-app
      component: backend
  template:
    metadata:
      labels:
        app: yatri-app
        component: backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: yatri-app-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_USER
          command:
            - python
            - -c
            - |
              import os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      response = f"""YATRI BACKEND
              ENVIRONMENT={os.getenv('ENVIRONMENT')}
              LOG_LEVEL={os.getenv('LOG_LEVEL')}
              PORT={os.getenv('PORT')}
              DEFAULT_CURRENCY={os.getenv('DEFAULT_CURRENCY')}
              MAX_BOOKING_DAYS={os.getenv('MAX_BOOKING_DAYS')}
              POSTGRES_USER={os.getenv('POSTGRES_USER')}
              """
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.end_headers()
                      self.wfile.write(response.encode())

              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend
  labels:
    app: yatri-app
    component: backend
spec:
  type: ClusterIP
  selector:
    app: yatri-app
    component: backend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-frontend
  labels:
    app: yatri-app
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-app
      component: frontend
  template:
    metadata:
      labels:
        app: yatri-app
        component: frontend
    spec:
      containers:
        - name: frontend
          image: nginx
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-frontend
  labels:
    app: yatri-app
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: yatri-app
    component: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yatri-ingress
  labels:
    app: yatri-app
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: yatri.local
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: yatri-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yatri-frontend
                port:
                  number: 80

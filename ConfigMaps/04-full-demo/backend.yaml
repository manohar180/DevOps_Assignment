apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-app
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-app
      component: backend
  template:
    metadata:
      labels:
        app: yatri-app
        component: backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          command: ["python", "-c"]
          args:
            - |
              import os
              from http.server import BaseHTTPRequestHandler, HTTPServer

              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = (
                          "YATRI BACKEND\n"
                          f"ENVIRONMENT={os.getenv('ENVIRONMENT')}\n"
                          f"LOG_LEVEL={os.getenv('LOG_LEVEL')}\n"
                          f"PORT={os.getenv('PORT')}\n"
                          f"DEFAULT_CURRENCY={os.getenv('DEFAULT_CURRENCY')}\n"
                          f"MAX_BOOKING_DAYS={os.getenv('MAX_BOOKING_DAYS')}\n"
                          f"POSTGRES_USER={os.getenv('POSTGRES_USER')}\n"
                      )
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.end_headers()
                      self.wfile.write(body.encode())

              HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: yatri-app-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend
  labels:
    app: yatri-app
    component: backend
spec:
  type: ClusterIP
  selector:
    app: yatri-app
    component: backend
  ports:
    - port: 80
      targetPort: 8080
